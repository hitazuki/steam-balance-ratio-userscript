name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  userscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        run: node --check steam-balance-ratio.user.js
      - name: Run tests
        run: node tests/steam-balance-ratio.test.cjs
